<header class="site-header">
  <div class="site-width header-inner">
    <a class="brand" rel="author" href="{{ '/' | relative_url }}">
      <img src="{{ '/images/logo_abc.png' | relative_url }}" width="91" height="90" alt="">
      {{ site.author | escape }}
    </a>
    <nav aria-label="Navigazione principale">
      <ul>
        {%- for path in site.header_pages -%}
          {%- assign nav_page = site.pages | where: "path", path | first -%}
          {%- if nav_page.title -%}
            <li><a href="{{ nav_page.url | relative_url }}"{% if page.url == nav_page.url %} aria-current="page"{% endif %}>{{ nav_page.title | escape }}</a></li>
          {%- endif -%}
        {%- endfor -%}
      </ul>
    </nav>
  </div>
</header>
