<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- capture seo_metadata -%}{% seo %}{%- endcapture -%}
  {{ seo_metadata }}
  {%- assign share_image = page.og_image | default: page.header_image | strip -%}
  {%- unless seo_metadata contains 'property="og:image"' or share_image == empty -%}
    <meta property="og:image" content="{{ share_image | absolute_url | escape }}">
  {%- endunless -%}
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  {%- feed_meta -%}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon/favicon-16x16.png' | relative_url }}">
  <link rel="manifest" href="{{ '/images/favicon/site.webmanifest' | relative_url }}">
  <link rel="mask-icon" href="{{ '/images/favicon/safari-pinned-tab.svg' | relative_url }}" color="#3ea69b">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#3ea69b">
</head>
